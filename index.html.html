<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objectif 27 000 pièces TikTok</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.widget{width:min(760px,96vw);padding:22px 30px 20px;background:linear-gradient(115deg,rgba(22,10,31,.95),rgba(12,12,29,.95));border:2px solid #d946ef;border-radius:18px;box-shadow:0 0 10px #ec4899,0 0 25px rgba(168,85,247,.75),inset 0 0 18px rgba(236,72,153,.12);position:relative}
.widget:before{content:"";position:absolute;inset:5px;border:1px solid rgba(192,132,252,.55);border-radius:12px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
.eyebrow{font-size:15px;letter-spacing:3px;color:#f0abfc;font-weight:800}
.tag{font-size:11px;letter-spacing:2px;color:#c4b5fd;border:1px solid #8b5cf6;padding:6px 9px;border-radius:20px}
.amount{font-size:42px;font-weight:900;letter-spacing:1px;text-align:center;margin:12px 0 14px;text-shadow:0 0 12px rgba(236,72,153,.65)}
.amount span{color:#f0abfc}
.track{height:17px;border-radius:20px;background:rgba(255,255,255,.13);overflow:hidden;border:1px solid rgba(216,180,254,.55)}
.fill{height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,#ec4899,#a855f7,#22d3ee);box-shadow:0 0 14px #d946ef;transition:width .45s ease}
.bottom{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#e9d5ff;font-weight:700;letter-spacing:1px}
.controls{margin-top:16px;padding-top:12px;border-top:1px solid rgba(216,180,254,.25);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
input{width:110px;background:#160e24;color:white;border:1px solid #a855f7;border-radius:8px;padding:9px;font-size:15px}
button{background:#35133f;color:white;border:1px solid #d946ef;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}
button:hover{background:#642078}
.hint{text-align:center;color:#c4b5fd;font-size:10px;margin-top:8px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="widget">
 <div class="top"><div class="eyebrow">🎮 OBJECTIF BURN CONTROLLER</div><div class="tag">27 000 PIÈCES</div></div>
 <div class="amount"><span id="current">0</span> <span> / 27 000 pièces</span></div>
 <div class="track"><div class="fill" id="fill"></div></div>
 <div class="bottom"><span id="percent">0 % ATTEINT</span><span id="remaining">27 000 PIÈCES RESTANTES</span></div>
 <div class="controls">
  <label for="add">Ajouter / retirer :</label><input id="add" type="number" min="1" step="1" value="100">
  <button id="plus">+ Ajouter</button><button id="minus">− Retirer</button><button id="reset">Réinitialiser</button>
 </div>
 <div class="hint">COMPTEUR MANUEL DE PROGRESSION • PIÈCES</div>
</div>
<script>
let total=0;const goal=27000;
const current=document.getElementById('current'),fill=document.getElementById('fill'),percent=document.getElementById('percent'),remaining=document.getElementById('remaining'),add=document.getElementById('add');
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
function render(){const p=Math.min(100,Math.floor(total/goal*100));current.textContent=fmt(total);fill.style.width=p+'%';percent.textContent=p+' % ATTEINT';remaining.textContent=fmt(Math.max(0,goal-total))+' PIÈCES RESTANTES'}
document.getElementById('plus').onclick=()=>{let n=Number(add.value);if(Number.isFinite(n)&&n>0){total=Math.min(goal,total+n);render()}};
document.getElementById('minus').onclick=()=>{let n=Number(add.value);if(Number.isFinite(n)&&n>0){total=Math.max(0,total-n);render()}};
document.getElementById('reset').onclick=()=>{total=0;render()};
render();
</script>
</body></html>
